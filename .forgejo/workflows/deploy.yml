name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: host
    steps:
      - name: Deploy static site to /var/www/portfolio
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          trap 'rm -rf "$WORKDIR"' EXIT

          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git" \
            "$WORKDIR"

          cp "$WORKDIR"/index.html "$WORKDIR"/style.css "$WORKDIR"/script.js /var/www/portfolio/
          chown -R www-data:www-data /var/www/portfolio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
